[package]
name = "mizu"
version = "0.1.0"
edition = "2021"
description = "A simple hydration reminder CLI tool"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
notify-rust = "4.10"
libc = "0.2"
rodio = { version = "0.17", optional = true }

[features]
default = []
sound = ["dep:rodio"]

[profile.release]
opt-level = 3
lto = true
strip = true
